name: CI quality gates

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  backend-and-contracts:
    name: Backend, CLI, templates, and contracts
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/upcode-harbor-service:${{ github.workspace }}/upcode-harbor-cli
      PYTHONPYCACHEPREFIX: /tmp/upcode-harbor-pycache
      UPCODE_HARBOR_CONFIG_DIR: /tmp/upcode-harbor-test/config
      UPCODE_HARBOR_STATE_DIR: /tmp/upcode-harbor-test/state
      UPCODE_HARBOR_JOB_DB: /tmp/upcode-harbor-test/config/jobs.db
      UPCODE_HARBOR_LOG_FILE: /tmp/upcode-harbor-test/upcode-harbor.log
      UPCODE_HARBOR_COMPOSE_DIR: /tmp/upcode-harbor-test/compose
      UPCODE_HARBOR_APP_DATA_DIR: /tmp/upcode-harbor-test/app-data
      UPCODE_HARBOR_APP_STORE_DIR: ${{ github.workspace }}/app-store-templates
      UPCODE_HARBOR_APP_SCHEMA: ${{ github.workspace }}/app-store-templates/app.schema.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            upcode-harbor-service/requirements.lock
            upcode-harbor-cli/requirements.lock
            requirements-quality.lock

      - name: Install locked dependencies and backend linter
        run: |
          python -m pip install -r upcode-harbor-service/requirements.lock -r upcode-harbor-cli/requirements.lock -r requirements-quality.lock

      - name: Check Python syntax recursively
        run: >-
          python -m compileall -q
          upcode-harbor-service/api
          upcode-harbor-service/handlers
          upcode-harbor-service/lib
          upcode-harbor-service/tests
          upcode-harbor-cli/cli
          upcode-harbor-cli/tests
          tools

      - name: Lint backend and CLI
        run: >-
          python -m flake8
          upcode-harbor-service/api
          upcode-harbor-service/handlers
          upcode-harbor-service/lib
          upcode-harbor-service/tests
          upcode-harbor-cli/cli
          upcode-harbor-cli/tests
          tools
          --jobs=1 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run backend tests
        run: python -m pytest upcode-harbor-service/tests

      - name: Run CLI tests
        run: python -m pytest upcode-harbor-cli/tests

      - name: Validate generated OpenAPI contracts
        run: python tools/generate_api_contract.py --check

      - name: Validate every App Store template
        run: python tools/validate_app_store.py

      - name: Check shell syntax
        run: >-
          find .
          -path ./.git -prune -o
          -path ./upcode-harbor/node_modules -prune -o
          -path ./upcode-harbor/public/novnc -prune -o
          -path ./upcode-harbor-service/ssh_keys -prune -o
          -path ./upcode-harbor-service/authorized_keys -prune -o
          -type f -name '*.sh' -print0
          | xargs -0 -r bash -n

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: upcode-harbor/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: upcode-harbor
        run: npm ci

      - name: Run ESLint
        working-directory: upcode-harbor
        run: npm run lint

      - name: Build frontend
        working-directory: upcode-harbor
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: upcode-harbor/.next
          retention-days: 7

  quality-gates-complete:
    name: Quality gates complete
    runs-on: ubuntu-latest
    needs: [backend-and-contracts, frontend]
    steps:
      - run: echo "All mandatory quality gates passed."
