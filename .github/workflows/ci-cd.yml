name: CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  build-frontend:
    name: Build Frontend (upservx)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: upservx/package-lock.json
      
      - name: Install dependencies
        working-directory: ./upservx
        run: npm ci
      
      - name: Build frontend
        working-directory: ./upservx
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: upservx/.next
          retention-days: 7

  build-backend:
    name: Build Backend (upservx-service)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: upservx-service/requirements.txt
      
      - name: Install dependencies
        working-directory: ./upservx-service
        run: pip3 install -r requirements.txt
      
      - name: Check Python syntax
        working-directory: ./upservx-service
        run: python3 -m py_compile *.py
      
      - name: Run tests (if available)
        working-directory: ./upservx-service
        run: |
          if [ -f "test_*.py" ] || [ -d "tests" ]; then
            pip3 install pytest
            pytest || echo "No tests found or tests failed"
          fi
        continue-on-error: true

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: upservx/package-lock.json
      
      - name: Install dependencies
        working-directory: ./upservx
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./upservx
        run: npm run lint || echo "Linting completed with warnings"
        continue-on-error: true

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          pip3 install flake8 pylint
      
      - name: Run Flake8
        working-directory: ./upservx-service
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
      
      - name: Run Pylint
        working-directory: ./upservx-service
        run: pylint *.py --disable=all --enable=E,F
        continue-on-error: true

  build-complete:
    name: Build Complete
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    
    steps:
      - name: Build Summary
        run: |
          echo "✅ Frontend build completed successfully"
          echo "✅ Backend dependencies installed successfully"
          echo "🎉 CI/CD Pipeline completed!"
