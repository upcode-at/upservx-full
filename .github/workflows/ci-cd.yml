name: CI quality gates

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  backend-and-contracts:
    name: Backend, CLI, templates, and contracts
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/upservx-service:${{ github.workspace }}/upservx-cli
      PYTHONPYCACHEPREFIX: /tmp/upservx-pycache
      UPSERVX_CONFIG_DIR: /tmp/upservx-test/config
      UPSERVX_STATE_DIR: /tmp/upservx-test/state
      UPSERVX_JOB_DB: /tmp/upservx-test/config/jobs.db
      UPSERVX_LOG_FILE: /tmp/upservx-test/upservx.log
      UPSERVX_COMPOSE_DIR: /tmp/upservx-test/compose
      UPSERVX_APP_DATA_DIR: /tmp/upservx-test/app-data
      UPSERVX_APP_STORE_DIR: ${{ github.workspace }}/app-store-templates
      UPSERVX_APP_SCHEMA: ${{ github.workspace }}/app-store-templates/app.schema.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            upservx-service/requirements.lock
            upservx-cli/requirements.lock
            requirements-quality.lock

      - name: Install locked dependencies and backend linter
        run: |
          python -m pip install -r upservx-service/requirements.lock -r upservx-cli/requirements.lock -r requirements-quality.lock

      - name: Check Python syntax recursively
        run: >-
          python -m compileall -q
          upservx-service/api
          upservx-service/handlers
          upservx-service/lib
          upservx-service/tests
          upservx-cli/cli
          upservx-cli/tests
          tools

      - name: Lint backend and CLI
        run: >-
          python -m flake8
          upservx-service/api
          upservx-service/handlers
          upservx-service/lib
          upservx-service/tests
          upservx-cli/cli
          upservx-cli/tests
          tools
          --jobs=1 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run backend tests
        run: python -m pytest upservx-service/tests

      - name: Run CLI tests
        run: python -m pytest upservx-cli/tests

      - name: Validate generated OpenAPI contracts
        run: python tools/generate_api_contract.py --check

      - name: Validate every App Store template
        run: python tools/validate_app_store.py

      - name: Check shell syntax
        run: >-
          find .
          -path ./.git -prune -o
          -path ./upservx/node_modules -prune -o
          -path ./upservx/public/novnc -prune -o
          -path ./upservx-service/ssh_keys -prune -o
          -path ./upservx-service/authorized_keys -prune -o
          -type f -name '*.sh' -print0
          | xargs -0 -r bash -n

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: upservx/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: upservx
        run: npm ci

      - name: Run ESLint
        working-directory: upservx
        run: npm run lint

      - name: Build frontend
        working-directory: upservx
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: upservx/.next
          retention-days: 7

  quality-gates-complete:
    name: Quality gates complete
    runs-on: ubuntu-latest
    needs: [backend-and-contracts, frontend]
    steps:
      - run: echo "All mandatory quality gates passed."
