# Harbor is a multi-service application.
# This compose file covers all core services.
# For production, use the official Harbor installer:
# https://goharbor.io/docs/latest/install-config/

services:

  harbor-log:
    image: goharbor/harbor-log:v2.11.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/log:/var/log/docker
    ports:
      - "127.0.0.1:1514:10514"

  harbor-db:
    image: goharbor/harbor-db:v2.11.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    depends_on:
      - harbor-log
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: goharbor/redis-photon:v2.11.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/redis:/var/lib/redis
    depends_on:
      - harbor-log

  registry:
    image: goharbor/registry-photon:v2.11.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/data:/storage
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/config/registry/:/etc/registry/:z
    environment:
      - GODEBUG=http2server=0
    depends_on:
      - harbor-log

  registryctl:
    image: goharbor/harbor-registryctl:v2.11.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/data:/storage
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/config/registry/:/etc/registry/:z
    environment:
      - CORE_SECRET=${CORE_SECRET:?CORE_SECRET is required}
      - JOBSERVICE_SECRET=${JOBSERVICE_SECRET:?JOBSERVICE_SECRET is required}
    depends_on:
      - harbor-log

  harbor-core:
    image: goharbor/harbor-core:v2.11.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/config/core/app.conf:/etc/core/app.conf:z
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/data:/data
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/config/core/certificates/:/etc/core/certificates/:z
    environment:
      - HARBOR_ADMIN_PASSWORD=${HARBOR_ADMIN_PASSWORD:?HARBOR_ADMIN_PASSWORD is required}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      - CORE_SECRET=${CORE_SECRET:?CORE_SECRET is required}
      - JOBSERVICE_SECRET=${JOBSERVICE_SECRET:?JOBSERVICE_SECRET is required}
      - HARBOR_HOSTNAME=${HARBOR_HOSTNAME:-localhost}
    depends_on:
      harbor-db:
        condition: service_healthy
      redis:
        condition: service_started

  harbor-jobservice:
    image: goharbor/harbor-jobservice:v2.11.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/data/job_logs:/var/log/jobs:z
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/config/jobservice/config.yml:/etc/jobservice/config.yml:z
    environment:
      - CORE_SECRET=${CORE_SECRET:?CORE_SECRET is required}
      - JOBSERVICE_SECRET=${JOBSERVICE_SECRET:?JOBSERVICE_SECRET is required}
    depends_on:
      - harbor-core

  harbor-portal:
    image: goharbor/harbor-portal:v2.11.0
    restart: unless-stopped
    depends_on:
      - harbor-core

  nginx:
    image: goharbor/nginx-photon:v2.11.0
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/harbor/config/nginx:/etc/nginx:z
    depends_on:
      - harbor-portal
      - harbor-core
      - harbor-jobservice
