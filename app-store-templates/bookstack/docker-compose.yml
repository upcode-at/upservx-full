version: '3.8'

services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    ports:
      - "6875:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      # Public URL – must match exactly, including port
      - APP_URL=http://your-server:6875
      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
      - DB_PASSWORD=changeme
    volumes:
      - /opt/upservx/data/bookstack:/config
    depends_on:
      bookstack-db:
        condition: service_healthy

  bookstack-db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: bookstack-db
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - MYSQL_ROOT_PASSWORD=changeme-root
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=changeme
    volumes:
      - /opt/upservx/data/bookstack-db:/config
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bookstack", "-pchangeme"]
      interval: 10s
      timeout: 5s
      retries: 5
