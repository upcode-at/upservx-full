services:
  registry:
    image: registry:3.0.0
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/registry/data:/var/lib/registry
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/registry/config:/etc/docker/registry
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/registry/auth:/auth
    environment:
      - REGISTRY_HTTP_ADDR=${REGISTRY_HTTP_ADDR:-0.0.0.0:5000}
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=${REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY:-/var/lib/registry}
      - REGISTRY_HTTP_SECRET=${REGISTRY_HTTP_SECRET:?REGISTRY_HTTP_SECRET is required}
      # Uncomment to enable basic auth (requires htpasswd file, see README)
      # - REGISTRY_AUTH=htpasswd
      # - REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm
      # - REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd

  registry-ui:
    image: joxit/docker-registry-ui:2.5.7
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Docker Registry
      - NGINX_PROXY_PASS_URL=${NGINX_PROXY_PASS_URL:?NGINX_PROXY_PASS_URL is required}
      - SHOW_CONTENT_DIGEST=true
      - SHOW_CATALOG_NB_TAGS=true
      - DELETE_IMAGES=true
    depends_on:
      - registry
