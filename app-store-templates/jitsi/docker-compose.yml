services:
  jitsi-web:
    image: jitsi/web:stable-10184
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/jitsi/web:/config
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/jitsi/transcripts:/usr/share/jitsi-meet/transcripts
    environment:
      - ENABLE_AUTH=${ENABLE_AUTH:-0}
      - ENABLE_GUESTS=${ENABLE_GUESTS:-1}
      - ENABLE_LETSENCRYPT=0
      - ENABLE_HTTP_REDIRECT=1
      - ENABLE_TRANSCRIPTIONS=0
      - DISABLE_HTTPS=0
      - JICOFO_AUTH_USER=focus
      - TZ=${TZ:-Europe/Vienna}
      - PUBLIC_URL=${PUBLIC_URL:-https://localhost:8443}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - JVB_TCP_HARVESTER_DISABLED=true
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb

  jitsi-prosody:
    image: jitsi/prosody:stable-10184
    restart: unless-stopped
    expose:
      - "5222"
      - "5347"
      - "5280"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/jitsi/prosody/config:/config
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/jitsi/prosody/prosody-plugins-custom:/prosody-plugins-custom
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH=${ENABLE_AUTH:-0}
      - ENABLE_GUESTS=${ENABLE_GUESTS:-1}
      - GLOBAL_MODULES=
      - GLOBAL_CONFIG=
      - LDAP_URL=
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_MODULES=
      - XMPP_MUC_MODULES=
      - XMPP_INTERNAL_MUC_MODULES=
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET:?JICOFO_COMPONENT_SECRET is required}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD:?JICOFO_AUTH_PASSWORD is required}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD:?JVB_AUTH_PASSWORD is required}
      - JIGASI_XMPP_USER=jigasi
      - JIGASI_XMPP_PASSWORD=${JIGASI_XMPP_PASSWORD:?JIGASI_XMPP_PASSWORD is required}
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JIBRI_RECORDER_PASSWORD:?JIBRI_RECORDER_PASSWORD is required}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JIBRI_XMPP_PASSWORD:?JIBRI_XMPP_PASSWORD is required}
      - TZ=${TZ:-Europe/Vienna}

  jitsi-jicofo:
    image: jitsi/jicofo:stable-10184
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/jitsi/jicofo:/config
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH=${ENABLE_AUTH:-0}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET:?JICOFO_COMPONENT_SECRET is required}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD:?JICOFO_AUTH_PASSWORD is required}
      - JVB_BREWERY_MUC=jvbbrewery
      - JIGASI_BREWERY_MUC=jigasibrewery
      - JIGASI_SIP_URI=
      - JIBRI_BREWERY_MUC=jibribrewery
      - JIBRI_PENDING_TIMEOUT=90
      - TZ=${TZ:-Europe/Vienna}
    depends_on:
      - jitsi-prosody

  jitsi-jvb:
    image: jitsi/jvb:stable-10184
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/jitsi/jvb:/config
    environment:
      - DOCKER_HOST_ADDRESS=your-server-ip
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD:?JVB_AUTH_PASSWORD is required}
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - JVB_TCP_HARVESTER_DISABLED=true
      - JVB_TCP_PORT=4443
      - JVB_STUN_SERVERS=meet-jit-si-turnrelay.jitsi.net:443
      - JVB_ENABLE_APIS=rest,colibri
      - TZ=${TZ:-Europe/Vienna}
    depends_on:
      - jitsi-prosody
