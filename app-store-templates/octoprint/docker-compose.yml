services:
  octoprint:
    image: octoprint/octoprint:1.11.2
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/octoprint:/octoprint
    environment:
      - OCTOPRINT_PORT=${OCTOPRINT_PORT:-5000}
      # Set to true and configure CAMERA_DEV to enable webcam streaming
      - ENABLE_MJPG_STREAMER=${ENABLE_MJPG_STREAMER:-false}
      - CAMERA_DEV=/dev/video0
      - MJPG_STREAMER_INPUT=-n -r 1280x720 -f 30
    # Access to USB serial port for 3D printer connection
    # Uncomment the device that matches your printer's USB port:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    # Required for USB device access:
    # group_add:
    #   - dialout
