version: '3.8'

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
      - VERSION=docker
    ports:
      - "32400:32400"
    volumes:
      - /opt/upservx/data/plex/config:/config
      - /opt/upservx/data/plex/transcode:/transcode
      - /mnt/media:/media
    restart: unless-stopped
