version: '3.8'

services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - LANGS=en_GB
    volumes:
      - /opt/upservx/data/stirling-pdf/configs:/configs
      - /opt/upservx/data/stirling-pdf/logs:/logs
      - /opt/upservx/data/stirling-pdf/customFiles:/customFiles
    ports:
      - "8080:8080"
