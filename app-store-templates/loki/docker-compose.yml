version: '3.8'

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - /opt/upservx/data/loki/data:/loki
      - /opt/upservx/data/loki/config:/etc/loki
    command: -config.file=/etc/loki/loki-config.yml
    user: "10001"
