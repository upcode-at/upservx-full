version: '3.8'

services:
  onlyoffice-mysql:
    image: mysql:8.0
    container_name: onlyoffice-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=onlyoffice_root
      - MYSQL_DATABASE=onlyoffice
      - MYSQL_USER=onlyoffice_user
      - MYSQL_PASSWORD=onlyoffice_password
    volumes:
      - /opt/upservx/data/onlyoffice-docs/mysql:/var/lib/mysql
    command: --sql_mode=''

  onlyoffice-mailserver:
    image: onlyoffice/mailserver:latest
    container_name: onlyoffice-mailserver
    restart: unless-stopped
    hostname: ${MAIL_DOMAIN:-mail.example.com}
    privileged: true
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - /opt/upservx/data/onlyoffice-docs/mail/vmail:/var/vmail
      - /opt/upservx/data/onlyoffice-docs/mail/certs:/etc/pki/tls/mailserver
      - /opt/upservx/data/onlyoffice-docs/mail/log:/var/log/onlyoffice
    depends_on:
      - onlyoffice-mysql

  onlyoffice-docs:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-docs
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - /opt/upservx/data/onlyoffice-docs/logs:/var/log/onlyoffice
      - /opt/upservx/data/onlyoffice-docs/data:/var/www/onlyoffice/Data
      - /opt/upservx/data/onlyoffice-docs/lib:/var/lib/onlyoffice
      - /opt/upservx/data/onlyoffice-docs/docdb:/var/lib/postgresql
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=changeme_use_a_strong_secret
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=false

  onlyoffice-communityserver:
    image: onlyoffice/communityserver:latest
    container_name: onlyoffice-communityserver
    restart: unless-stopped
    ports:
      - "8091:80"
      - "5222:5222"
    volumes:
      - /opt/upservx/data/onlyoffice-docs/community/data:/var/www/onlyoffice/Data
      - /opt/upservx/data/onlyoffice-docs/community/log:/var/log/onlyoffice
      - /opt/upservx/data/onlyoffice-docs/community/letsencrypt:/etc/letsencrypt
    environment:
      - MYSQL_SERVER_HOST=onlyoffice-mysql
      - MYSQL_SERVER_PORT=3306
      - MYSQL_SERVER_DB_NAME=onlyoffice
      - MYSQL_SERVER_USER=onlyoffice_user
      - MYSQL_SERVER_PASS=onlyoffice_password
      - DOCUMENT_SERVER_PORT_80_TCP_ADDR=onlyoffice-docs
      - DOCUMENT_SERVER_JWT_ENABLED=true
      - DOCUMENT_SERVER_JWT_SECRET=changeme_use_a_strong_secret
      - MAIL_SERVER_API_HOST=onlyoffice-mailserver
      - MAIL_SERVER_DB_HOST=onlyoffice-mysql
      - MAIL_SERVER_DB_PORT=3306
      - MAIL_SERVER_DB_NAME=onlyoffice
      - MAIL_SERVER_DB_USER=onlyoffice_user
      - MAIL_SERVER_DB_PASS=onlyoffice_password
    depends_on:
      - onlyoffice-mysql
      - onlyoffice-docs
      - onlyoffice-mailserver
