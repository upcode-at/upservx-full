services:
  onlyoffice-mysql:
    image: mysql:8.0.43
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_DATABASE=onlyoffice
      - MYSQL_USER=onlyoffice_user
      - MYSQL_PASSWORD=${MYSQL_SERVER_PASS:?MYSQL_SERVER_PASS is required}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/mysql:/var/lib/mysql
    command: --sql_mode=''

  onlyoffice-mailserver:
    image: onlyoffice/mailserver:1.6.27
    restart: unless-stopped
    hostname: ${MAIL_DOMAIN:-mail.example.com}
    privileged: true
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/mail/vmail:/var/vmail
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/mail/certs:/etc/pki/tls/mailserver
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/mail/log:/var/log/onlyoffice
    depends_on:
      - onlyoffice-mysql

  onlyoffice-docs:
    image: onlyoffice/documentserver:8.3.3
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/logs:/var/log/onlyoffice
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/data:/var/www/onlyoffice/Data
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/lib:/var/lib/onlyoffice
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/docdb:/var/lib/postgresql
    environment:
      - JWT_ENABLED=${JWT_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=false

  onlyoffice-communityserver:
    image: onlyoffice/communityserver:12.6.0.1900
    restart: unless-stopped
    ports:
      - "8091:80"
      - "5222:5222"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/community/data:/var/www/onlyoffice/Data
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/community/log:/var/log/onlyoffice
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/onlyoffice-docs/community/letsencrypt:/etc/letsencrypt
    environment:
      - MYSQL_SERVER_HOST=onlyoffice-mysql
      - MYSQL_SERVER_PORT=3306
      - MYSQL_SERVER_DB_NAME=onlyoffice
      - MYSQL_SERVER_USER=${MYSQL_SERVER_USER:-onlyoffice_user}
      - MYSQL_SERVER_PASS=${MYSQL_SERVER_PASS:?MYSQL_SERVER_PASS is required}
      - DOCUMENT_SERVER_PORT_80_TCP_ADDR=onlyoffice-docs
      - DOCUMENT_SERVER_JWT_ENABLED=true
      - DOCUMENT_SERVER_JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - MAIL_SERVER_API_HOST=onlyoffice-mailserver
      - MAIL_SERVER_DB_HOST=onlyoffice-mysql
      - MAIL_SERVER_DB_PORT=3306
      - MAIL_SERVER_DB_NAME=onlyoffice
      - MAIL_SERVER_DB_USER=onlyoffice_user
      - MAIL_SERVER_DB_PASS=${MYSQL_SERVER_PASS:?MYSQL_SERVER_PASS is required}
    depends_on:
      - onlyoffice-mysql
      - onlyoffice-docs
      - onlyoffice-mailserver
