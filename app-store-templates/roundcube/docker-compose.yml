version: '3.8'

services:
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - /opt/upservx/data/roundcube/www:/var/www/html
      - /opt/upservx/data/roundcube/db:/var/roundcube/db
    environment:
      # IMAP server settings ← change to your mail server
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mail.example.com
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      # SMTP server settings ← change to your mail server
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail.example.com
      - ROUNDCUBEMAIL_SMTP_PORT=587
      # Database (sqlite for single-user/small setups, mysql for larger)
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      # UI
      - ROUNDCUBEMAIL_SKIN=elastic
      # Plugins (comma-separated)
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,managesieve
      # Upload limit
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
      # Spam folder
      - ROUNDCUBEMAIL_SPELLCHECK_ENGINE=googie
