services:
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.6.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ZIGBEE2MQTT_DATA=${ZIGBEE2MQTT_DATA:-/app/data}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/zigbee2mqtt:/app/data
      # Pass through the Zigbee USB adapter – adjust the device path if needed
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/mosquitto/config:/mosquitto/config
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/mosquitto/data:/mosquitto/data
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/mosquitto/log:/mosquitto/log
