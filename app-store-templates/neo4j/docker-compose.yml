version: '3.8'

services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (drivers/clients)
    volumes:
      - /opt/upservx/data/neo4j/data:/data
      - /opt/upservx/data/neo4j/logs:/logs
      - /opt/upservx/data/neo4j/import:/var/lib/neo4j/import
      - /opt/upservx/data/neo4j/plugins:/plugins
    environment:
      # Auth: format is username/password ← change password!
      - NEO4J_AUTH=neo4j/changeme_strong_password
      # Plugins to auto-install (APOC is the most common utility library)
      - NEO4J_PLUGINS=["apoc"]
      # Memory settings – adjust to available RAM
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
      # Allow APOC procedures
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
