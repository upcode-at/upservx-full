version: '3.8'

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: hbbs
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/upservx/data/rustdesk:/root
    environment:
      - ENCRYPTED_ONLY=1
    depends_on:
      - hbbr

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/upservx/data/rustdesk:/root
