services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:version-2.7.6
    restart: unless-stopped
    ports:
      - "8888:80"
      - "8889:443"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/heimdall:/config
