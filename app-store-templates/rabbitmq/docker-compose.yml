services:
  rabbitmq:
    image: rabbitmq:4.1.3-management
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP protocol (producers & consumers)
      - "15672:15672"   # Management UI (HTTP)
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/rabbitmq/data:/var/lib/rabbitmq
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/rabbitmq/logs:/var/log/rabbitmq
    environment:
      # Admin credentials ← change before exposing publicly!
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST:-/}
    hostname: rabbitmq
