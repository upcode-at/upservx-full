version: '3.8'

services:
  motioneye:
    image: ghcr.io/motioneye-project/motioneye:latest
    container_name: motioneye
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - /opt/upservx/data/motioneye/config:/etc/motioneye
      - /opt/upservx/data/motioneye/media:/var/lib/motioneye
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Berlin
    # Pass through video devices (USB cameras)
    # Uncomment and adjust as needed:
    # devices:
    #   - /dev/video0:/dev/video0
    #   - /dev/video1:/dev/video1
