services:
  motioneye:
    image: ghcr.io/motioneye-project/motioneye:0.43.1
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/motioneye/config:/etc/motioneye
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/motioneye/media:/var/lib/motioneye
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Berlin}
    # Pass through video devices (USB cameras)
    # Uncomment and adjust as needed:
    # devices:
    #   - /dev/video0:/dev/video0
    #   - /dev/video1:/dev/video1
