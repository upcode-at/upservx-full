services:
  emby:
    image: emby/embyserver:4.8.11.0
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Vienna}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/emby/config:/config
      - /mnt/media:/media
    ports:
      - "8096:8096"
      - "8920:8920"
