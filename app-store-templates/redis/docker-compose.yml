services:
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/redis/data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
