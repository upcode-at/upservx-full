services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Vienna}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/jellyfin/config:/config
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/jellyfin/cache:/cache
      - /mnt/media:/media
    ports:
      - "8096:8096"
      - "8920:8920"
