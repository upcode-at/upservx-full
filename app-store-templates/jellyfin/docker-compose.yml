version: '3.8'

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
    volumes:
      - /opt/upservx/data/jellyfin/config:/config
      - /opt/upservx/data/jellyfin/cache:/cache
      - /mnt/media:/media
    ports:
      - "8096:8096"
      - "8920:8920"
