services:
  mattermost:
    image: mattermost/mattermost-team-edition:10.10.1
    restart: unless-stopped
    ports:
      - "8065:8065"
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=${MM_SQLSETTINGS_DRIVERNAME:-postgres}
      - MM_SQLSETTINGS_DATASOURCE=postgres://mattermost:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@mattermost-db/mattermost?sslmode=disable
      - MM_BLEVESETTINGS_INDEXDIR=${MM_BLEVESETTINGS_INDEXDIR:-/mattermost/bleve-indexes}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/mattermost/config:/mattermost/config
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/mattermost/data:/mattermost/data
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/mattermost/logs:/mattermost/logs
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/mattermost/plugins:/mattermost/plugins
    depends_on:
      mattermost-db:
        condition: service_healthy

  mattermost-db:
    image: postgres:15.13-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mattermost}
      - POSTGRES_USER=${POSTGRES_USER:-mattermost}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/mattermost-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5
