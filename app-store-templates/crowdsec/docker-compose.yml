version: '3.8'

services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    ports:
      - "8080:8080"   # Local API (for bouncers)
      - "6060:6060"   # Prometheus metrics
    environment:
      - GID=1000
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/sshd crowdsecurity/nginx
    volumes:
      - /opt/upservx/data/crowdsec/config:/etc/crowdsec
      - /opt/upservx/data/crowdsec/data:/var/lib/crowdsec/data
      # Host logs to analyze – add more as needed
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/syslog:/var/log/syslog:ro
      - /var/log/nginx:/var/log/nginx:ro

  # Firewall bouncer – blocks IPs via nftables/iptables on the host
  crowdsec-firewall-bouncer:
    image: crowdsecurity/cs-firewall-bouncer:latest
    container_name: crowdsec-firewall-bouncer
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - CROWDSEC_LAPI_URL=http://crowdsec:8080
      # Set this after registering the bouncer: see README
      - CROWDSEC_LAPI_KEY=changeme
    depends_on:
      - crowdsec
