services:
  teamspeak:
    image: teamspeak:3.13.7
    restart: unless-stopped
    environment:
      - TS3SERVER_LICENSE=${TS3SERVER_LICENSE:-accept}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/teamspeak:/var/ts3server
    ports:
      - "9987:9987/udp"
      - "10011:10011"
      - "30033:30033"
