services:
  ombi:
    image: lscr.io/linuxserver/ombi:version-v4.47.1
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Vienna}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/ombi/config:/config
    ports:
      - "3579:3579"
