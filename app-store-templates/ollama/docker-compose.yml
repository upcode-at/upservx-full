services:
  ollama:
    image: ollama/ollama:0.11.2
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
    volumes:
      - ${APP_DATA_DIR:?APP_DATA_DIR is required}/ollama:/root/.ollama
    # Uncomment the following lines to enable NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
